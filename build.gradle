plugins {
    id 'com.android.application' version '7.4.2'
    id 'com.android.library' version '7.4.2' apply false
    id 'com.google.protobuf' version '0.9.1'
}

android {
    namespace 'com.android.launcher3'
    compileSdk 31

    defaultConfig {
        applicationId 'io.github.akku1139.launcher3'
        minSdk 26
        targetSdk 31
        versionCode 300220226
        versionName '3.0.0-bv'
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("SIGNING_KEYSTORE_PATH")
            def storePass = System.getenv("SIGNING_STORE_PASSWORD")
            def aliasName = System.getenv("SIGNING_KEY_ALIAS")
            def keyPass = System.getenv("SIGNING_KEY_PASSWORD")
            if (ksPath != null && storePass != null && !ksPath.isEmpty()) {
                def ksFile = file(ksPath)
                if (ksFile.exists()) {
                    storeFile ksFile
                    storePassword storePass
                    keyAlias (aliasName != null && !aliasName.isEmpty() ? aliasName : "bvlauncher")
                    keyPassword (keyPass != null && !keyPass.isEmpty() ? keyPass : storePass)
                }
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            versionNameSuffix '-debug'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            shrinkResources false
            versionNameSuffix '-release'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    flavorDimensions 'recents'
    productFlavors {
        withoutQuickstep {
            dimension 'recents'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            res.srcDirs = ['res']
            java.srcDirs = ['src', 'src_plugins']
            manifest.srcFile 'AndroidManifest-standalone.xml'
            proto {
                srcDirs = ['protos/', 'protos_overrides/']
            }
        }
        withoutQuickstep {
            java.srcDirs = ['src_ui_overrides', 'src_shortcuts_overrides']
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/*.kotlin_module']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    buildFeatures {
        buildConfig true
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "BvLauncher-${variant.versionName}-${variant.name}.apk"
        }
    }
}

dependencies {
    implementation project(':IconLoader')
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.preference:preference:1.1.1'
    implementation 'androidx.core:core:1.6.0'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.slice:slice-builders:1.0.0'
    implementation 'com.google.protobuf:protobuf-javalite:3.17.3'
    implementation 'com.airbnb.android:lottie:3.3.0'

    compileOnly files('prebuilts/libs/framework.jar')
    compileOnly files('prebuilts/libs/plugin_core.jar')
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.17.3"
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                remove java
                java {
                    option 'lite'
                }
            }
        }
    }
}

