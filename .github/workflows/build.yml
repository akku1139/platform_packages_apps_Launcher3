name: Build & Release

on:
  push:
    branches: [bv-launcher-ui]
    tags: ['v*']
  pull_request:
    branches: [bv-launcher-ui]
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  validate:
    name: Validate resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xmllint
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
      - name: XML + markers
        run: |
          set -e
          for f in res/values/*.xml res/values-land/*.xml; do
            [ -f "$f" ] || continue
            xmllint --noout "$f"
          done
          grep -q 'name="notification_dot_color"' res/values/colors.xml
          grep -qi 'FE4621' res/values/colors.xml
          grep -q 'dynamic_grid_icon_drawable_padding">8dp' res/values/dimens.xml
          grep -q "applicationId 'io.github.akku1139.launcher3'" build.gradle
          echo OK

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure platform android-31
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          if [ ! -d "$ANDROID_HOME/platforms/android-31" ]; then
            CMDLINE=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)
            yes | "$CMDLINE" --licenses || true
            "$CMDLINE" "platforms;android-31" "build-tools;31.0.0"
          fi

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "SIGNING_KEYSTORE_BASE64 secret missing"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$HOME/bvlauncher.jks"
          echo "SIGNING_KEYSTORE_PATH=$HOME/bvlauncher.jks" >> $GITHUB_ENV
          echo "SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> $GITHUB_ENV
          echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> $GITHUB_ENV
          echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> $GITHUB_ENV
          ls -la "$HOME/bvlauncher.jks"

      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleWithoutQuickstepRelease --stacktrace

      - name: Locate APK and verify signature
        id: apk
        run: |
          APK=$(find ./build -name '*.apk' 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            find . -name '*.apk' || true
            exit 1
          fi
          echo "path=$APK" >> $GITHUB_OUTPUT
          ls -lh "$APK"
          # Verify APK is signed
          $ANDROID_HOME/build-tools/*/apksigner verify --print-certs "$APK" 2>/dev/null || \
            jarsigner -verify -verbose -certs "$APK" | tail -20

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BvLauncher-APK
          path: ${{ steps.apk.outputs.path }}

      - name: Prepare release metadata
        id: meta
        run: |
          SHA_SHORT=${GITHUB_SHA::7}
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "name=BvLauncher ${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag=ci-${GITHUB_RUN_NUMBER}-${SHA_SHORT}" >> $GITHUB_OUTPUT
            echo "name=BvLauncher CI #${GITHUB_RUN_NUMBER} (${SHA_SHORT})" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
          body: |
            Signed BvLauncher UI port (applicationId: `io.github.akku1139.launcher3`).

            - Branch: `${{ github.ref_name }}`
            - Commit: `${{ github.sha }}`
            - Variant: `withoutQuickstepRelease`
            - Signed with project release keystore
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
